<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOKA · Live Order Tracking</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div id="nav"></div>

<div class="wrap narrow" id="root">
  <div class="card elevated" style="text-align:center;padding:40px 20px">
    <div class="mute" style="font-size:14px;letter-spacing:0.05em">Connecting to MOKA live kitchen…</div>
  </div>
</div>

<div id="footer"></div>

<script type="module">
import { api, nav, footer, hhmm, rs, esc, liveStream } from './assets/api.js';
document.getElementById('nav').innerHTML = nav('');
document.getElementById('footer').innerHTML = footer();

const q = new URLSearchParams(location.search);
const last = JSON.parse(localStorage.getItem('qb_last') || '{}');
const id = q.get('o') || last.id;
const key = q.get('key') || last.key;

const confetti = Array.from({ length: 20 }, (_, i) => 
  `<i style="left:${i * 5}%;background:${i % 2 === 0 ? '#C6A77E' : '#BFA9C7'};animation-delay:${(i % 5) * 0.4}s"></i>`
).join('');

const scenes = {
  accepted: `
    <div class="scene">
      <div style="width:68px;height:68px;border-radius:50%;background:var(--color-secondary-tint);border:2px solid var(--color-accent);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(101,71,101,0.15)">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#654765" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path>
          <polyline points="22 4 12 14.01 9 11.01"></polyline>
        </svg>
      </div>
      <div class="cap">Order Confirmed &amp; Queued</div>
    </div>`,

  preparing: `
    <div class="scene">
      <div class="steam"><i></i><i></i><i></i></div>
      <div style="width:72px;height:72px;border-radius:50%;background:var(--color-primary-surface);border:2px solid var(--color-primary);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(101,71,101,0.2)">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#654765" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
          <line x1="6" y1="1" x2="6" y2="4"></line>
          <line x1="10" y1="1" x2="10" y2="4"></line>
          <line x1="14" y1="1" x2="14" y2="4"></line>
        </svg>
      </div>
      <div class="cap">Crafting Fresh in the Kitchen…</div>
    </div>`,

  ready: `
    <div class="scene">
      <div class="confetti">${confetti}</div>
      <div class="bounce" style="width:74px;height:74px;border-radius:50%;background:var(--color-accent-tint);border:2px solid var(--color-accent);display:flex;align-items:center;justify-content:center;box-shadow:0 6px 20px rgba(198,167,126,0.3)">
        <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#654765" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <path d="M16 10a4 4 0 0 1-8 0"></path>
        </svg>
      </div>
      <div class="cap" style="color:var(--color-primary-dark)">Fresh &amp; Ready for You!</div>
    </div>`,

  delay: `
    <div class="scene">
      <div class="tick" style="width:68px;height:68px;border-radius:50%;background:var(--color-warning-bg);border:2px solid var(--color-warning);display:flex;align-items:center;justify-content:center">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#9E6B28" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <polyline points="12 6 12 12 16 14"></polyline>
        </svg>
      </div>
      <div class="cap">Perfecting Your Order — Brief Delay</div>
    </div>`,

  placed: `
    <div class="scene">
      <div style="width:68px;height:68px;border-radius:50%;background:var(--color-accent-tint);border:2px solid var(--color-accent);display:flex;align-items:center;justify-content:center">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#654765" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="4" width="22" height="16" rx="2" ry="2"></rect>
          <line x1="1" y1="10" x2="23" y2="10"></line>
        </svg>
      </div>
      <div class="cap">Awaiting Payment Confirmation</div>
    </div>`,

  cancelled: `
    <div class="scene">
      <div style="width:68px;height:68px;border-radius:50%;background:var(--color-error-bg);border:2px solid var(--color-error);display:flex;align-items:center;justify-content:center">
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#9E3A3A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
      </div>
      <div class="cap" style="color:var(--color-error)">Order Cancelled</div>
    </div>`,

  completed: `
    <div class="scene">
      <div style="width:68px;height:68px;border-radius:50%;background:var(--color-secondary-tint);border:2px solid var(--color-accent);display:flex;align-items:center;justify-content:center">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="#654765" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
      </div>
      <div class="cap">Enjoy Your Daily Fix!</div>
    </div>`
};

let data = null;

async function refresh() {
  if (!id) {
    document.getElementById('root').innerHTML = `
      <div class="card err" style="text-align:center;padding:24px">
        No active order found. <a href="index.html" style="color:inherit;font-weight:700">Browse Menu</a>
      </div>`;
    return;
  }
  try {
    data = await api(`/orders/${id}/live?key=${key}`);
    paint();
  } catch (e) {
    document.getElementById('root').innerHTML = `
      <div class="card err" style="text-align:center;padding:24px">
        Order not found or invalid tracking token. Please verify your receipt link.
      </div>`;
  }
}

function phase(d) {
  if (d.status === 'COMPLETED' || d.status === 'HANDED_OVER') return 'completed';
  if (['CANCELLED', 'REFUNDED', 'REFUND_PENDING', 'EXPIRED', 'NO_SHOW'].includes(d.status)) return 'cancelled';
  if (d.phase === 'ready') return 'ready';
  if (d.phase === 'preparing') return 'preparing';
  if (d.phase === 'accepted') return 'accepted';
  return 'placed';
}

function paint() {
  const d = data;
  const ph = phase(d);
  const showDelay = d.notifications.some(n => n.event === 'DELAY_DETECTED') && 
                    ['accepted', 'preparing'].includes(ph) && 
                    d.notifications.at(-1)?.event === 'DELAY_DETECTED';

  const steps = ['Accepted', 'Preparing', 'Ready'];
  const idx = { placed: -1, accepted: 0, preparing: 1, ready: 2, completed: 2, cancelled: -1 }[ph];
  const root = document.getElementById('root');

  root.innerHTML = `
    <!-- Token Identification Card -->
    <div class="card elevated" style="text-align:center;border-top:4px solid var(--color-primary)">
      <div class="mute" style="font-size:12px;text-transform:uppercase;letter-spacing:0.08em;font-weight:600">Your MOKA Pickup Token</div>
      <div class="tok big" style="font-size:68px;line-height:1.1;margin:6px 0;letter-spacing:0.04em">${esc(d.token || '—')}</div>
      <div class="pill ${ph === 'cancelled' ? 'red' : ph === 'ready' ? 'champagne' : ''}" style="font-size:12px;padding:4px 14px">
        ● ${ph.toUpperCase()}
      </div>
    </div>

    <!-- Visual Scene Micro-Animation -->
    ${scenes[showDelay ? 'delay' : ph]}

    <!-- Real-time Progress & Guidance Card -->
    <div class="card elevated" style="margin-top:16px">
      <div class="row" style="justify-content:space-between;margin-bottom:6px">
        ${steps.map((s, i) => `
          <span class="pill ${i <= idx ? 'champagne' : 'grey'}">
            ${i <= idx ? '✓ ' : ''}${s}
          </span>
        `).join('<span class="mute" style="color:var(--color-line-dark)">→</span>')}
      </div>

      <div class="bar" style="margin:14px 0">
        <i style="width:${ph === 'ready' || ph === 'completed' ? 100 : d.progress}%"></i>
      </div>

      ${d.eta ? `
        <div class="row" style="background:var(--color-surface-warm);padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--color-line);margin-bottom:12px">
          <div>
            <span class="mute" style="font-size:11px;text-transform:uppercase;letter-spacing:0.05em">Estimated Window</span>
            <div style="font-size:20px;font-weight:700;color:var(--color-primary-dark)">Ready in ${d.eta.lo}–${d.eta.hi} min</div>
          </div>
          <span class="sp"></span>
          <span class="pill champagne" style="font-family:var(--font-mono)">Target ~${hhmm(d.eta.readyAt)}</span>
        </div>` : ''}

      ${d.leaveAt && !['ready', 'completed', 'cancelled'].includes(ph) ? `
        <div class="ok" style="display:flex;align-items:center;gap:10px">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          <div>Optimal travel schedule: Leave at <b>${hhmm(d.leaveAt)}</b> so your coffee &amp; bakes are hot upon arrival.</div>
        </div>` : ''}

      ${ph === 'ready' ? `
        <div class="ok" style="background:var(--color-accent-tint);border-color:var(--color-accent);color:var(--color-primary-dark)">
          <b>Collect Your Order:</b> ${d.mode === 'DINE_IN' ? 'Your server is bringing it to your table.' : 'Present Token ' + esc(d.token) + ' at the MOKA pickup counter.'}
        </div>` : ''}

      ${showDelay ? `
        <div class="err">
          We are taking extra care with your items. Updated timing is reflected above.
        </div>` : ''}

      <div style="border-top:1px solid var(--color-line);padding-top:12px;margin-top:14px">
        <h3 style="margin-bottom:8px">Order Summary</h3>
        <ul style="padding-left:18px;margin:0 0 10px;font-size:14px">
          ${d.items.map(i => `<li style="margin-bottom:3px"><b>${i.qty}×</b> ${esc(i.name)}</li>`).join('')}
        </ul>
        <div class="row">
          <span class="mute">Order Total</span>
          <span class="sp"></span>
          <b style="font-size:18px;color:var(--color-primary-dark)">${rs(d.total)}</b>
        </div>
      </div>

      ${ph === 'placed' ? `
        <div style="background:var(--color-surface-warm);padding:14px;border-radius:var(--radius-sm);border:1px solid var(--color-accent);margin:14px 0 6px;text-align:center">
          <div style="font-weight:700;color:var(--color-primary-dark);margin-bottom:8px">Awaiting Payment to Begin Fresh Preparation (${rs(d.total)})</div>
          <button id="payTrack" class="champagne" style="padding:10px 22px;font-weight:700">Pay Now &amp; Send to Kitchen</button>
        </div>` : ''}

      <div class="row" style="margin-top:16px">
        ${d.mode === 'PREORDER' && !d.arrived && ['accepted', 'preparing'].includes(ph) ? `
          <button class="alt" id="leaving" style="flex:1">🚗 On My Way</button>
          <button id="here" style="flex:1">📍 I Have Arrived</button>` : ''}
        ${['accepted', 'preparing', 'placed'].includes(ph) ? `
          <button class="alt red" id="cancel" style="color:#FFFFFF">Cancel Order</button>` : ''}
      </div>
      <div id="note"></div>
    </div>

    <!-- Phone Simulator: Messages Sent to Customer -->
    <div class="card elevated">
      <div class="row" style="margin-bottom:8px">
        <h3 style="margin:0">MOKA Customer Notifications</h3>
        <span class="sp"></span>
        <span class="pill" style="font-size:10.5px">SMS &amp; WhatsApp Feed</span>
      </div>
      <div class="phone">
        ${d.notifications.length ? d.notifications.map(n => `
          <div class="msg">
            <b>${n.channel === 'WHATSAPP' ? 'WhatsApp' : 'SMS'} · MOKA Concierge · ${esc(n.animation)} alert</b>
            ${esc(n.text)}
          </div>
        `).join('') : '<div class="mute" style="text-align:center;padding:12px">No notifications dispatched yet.</div>'}
      </div>
    </div>`;

  const act = (sel, path) => {
    const b = root.querySelector(sel);
    if (b) b.onclick = async () => {
      try {
        await api(`/orders/${id}/${path}?key=${key}`, { method: 'POST', body: {} });
        await refresh();
      } catch (e) {
        root.querySelector('#note').innerHTML = `
          <div class="err">${esc(e.message)}${e.code === 'COOKING_STARTED' ? ' Please request counter assistance.' : ''}</div>`;
      }
    };
  };

  act('#leaving', 'leaving');
  act('#here', 'arrived');
  act('#cancel', 'cancel');

  const payBtn = root.querySelector('#payTrack');
  if (payBtn) payBtn.onclick = async () => {
    try {
      await api(`/dev/pay/${id}?key=${key}`, { method: 'POST' });
      await refresh();
    } catch (e) {
      root.querySelector('#note').innerHTML = `<div class="err">${esc(e.message)}</div>`;
    }
  };
}

refresh();
liveStream(`/orders/${id}/stream?key=${key}`, () => refresh());
setInterval(refresh, 4000);
</script>
</body>
</html>
